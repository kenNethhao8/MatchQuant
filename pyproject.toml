[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "matchquant"
version = "0.1.0"
description = "A reproducible, low-cost football prediction and walk-forward backtesting framework"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
]

[project.scripts]
matchquant = "matchquant.launcher:main"

[tool.setuptools.packages.find]
include = ["matchquant*"]

[tool.setuptools.package-data]
"matchquant.resources" = [
    "m3_candidates.json",
    "examples/*",
    "demo/*",
    "demo/**/*",
]
